# Anchor runs as its OWN Compose project (name: anchor) — entirely separate from
# the `nucleus` project, so `docker compose -p nucleus down` never takes it with
# it. Start it independently:  cd apps/anchor/deploy && docker compose up -d --build
name: anchor

services:
  anchor:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8888"            # direct host port — the canonical break-glass surface
    environment:
      ANCHOR_DATA: /data
      ANCHOR_ADDR: ":8888"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # ANCHOR_SECURE: "1"     # enable when served over HTTPS (Tailscale) so the
                               # session cookie gets the Secure flag.
    volumes:
      - anchor_data:/data      # config (0600) + audit.jsonl live here; survives recreate
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  # Read-only Docker API gateway. Anchor never touches the raw socket — this proxy
  # is the platform-level enforcement of "no mutations, no exec" for Phase 2.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 0                  # block ALL mutating calls (start/stop/create/...)
      EXEC: 0                  # block container exec entirely
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No host ports — only reachable by `anchor` on this project's private network.

volumes:
  anchor_data:
