# Anchor runs as its OWN Compose project (name: anchor) — entirely separate from
# the `nucleus` project, so `docker compose -p nucleus down` never takes it with
# it. Start it independently:
#
#   NUCLEUS_REPO=$(cd ../../.. && pwd) docker compose up -d --build
#
# NUCLEUS_REPO must be the ABSOLUTE host path of the Nucleus repo. Anchor mounts
# it at that SAME path inside the container so `docker compose` recreate/rebuild
# resolves the project's relative build contexts and bind mounts to paths the
# host daemon can actually see. If unset, recreate/rebuild/.env editing are
# simply disabled (read-only + lifecycle still work).
name: anchor

services:
  anchor:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8888"            # direct host port — the canonical break-glass surface
    environment:
      ANCHOR_DATA: /data
      ANCHOR_ADDR: ":8888"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Recreate/rebuild derive the compose project + files from each container's
      # own labels — Anchor just needs the repo mounted at its host path (below).
      # NUCLEUS_ENV points the .env editor at the central env file.
      NUCLEUS_ENV: ${NUCLEUS_REPO:-/opt/nucleus-not-mounted}/infra/.env
      # Where Anchor reads backup bundles (read-only bind mount below).
      ANCHOR_BACKUP_DIR: /backups
      # The SAME directory as the host sees it — the mongorestore helper container
      # bind-mounts this (a sibling's mount source resolves on the host).
      ANCHOR_BACKUP_HOST_DIR: ${ANCHOR_BACKUP_HOST_DIR:-/home/debian/backups/minio}
      # Where the MinIO data volume is mounted for restore (rw bind mount below).
      ANCHOR_RESTORE_TARGET: /restore/minio
      # MinIO volume NAME — the on-demand backup helper mounts it by name.
      ANCHOR_MINIO_VOLUME: ${ANCHOR_MINIO_VOLUME:-nucleus_minio_data}
      # ANCHOR_SECURE: "1"     # enable when served over HTTPS (Tailscale)
    volumes:
      - anchor_data:/data      # config (0600) + audit.jsonl; survives recreate
      # Nucleus repo mounted at its own absolute path (see header).
      - ${NUCLEUS_REPO:-/opt/nucleus-not-mounted}:${NUCLEUS_REPO:-/opt/nucleus-not-mounted}
      # Backup bundles, read-WRITE: Anchor lists + restores from here and also
      # creates new bundles on demand. Host path is set per-environment via
      # ANCHOR_BACKUP_HOST_DIR (prod: /home/debian/backups/minio).
      - ${ANCHOR_BACKUP_HOST_DIR:-/home/debian/backups/minio}:/backups
      # The live MinIO data volume, read-WRITE — only touched during a restore
      # (stop MinIO → wipe + re-extract → start). External: owned by the nucleus
      # project. Name overridable via ANCHOR_MINIO_VOLUME.
      - minio_data:/restore/minio
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.75"

  # Docker API gateway. Phase 3 enables POST (lifecycle/recreate) and BUILD
  # (rebuild) but keeps EXEC=0 — no exec into containers, ever. Anchor's own
  # allowlist + nucleus.managed scope + two-step confirm are the finer controls.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      BUILD: 1                 # allow image builds (rebuild-from-source)
      POST: 1                  # allow mutating calls (start/stop/restart/recreate)
      EXEC: 0                  # blocks exec START (/exec/{id}/start) -> no command
                               # can actually run. NB: exec CREATE falls under the
                               # CONTAINERS grant and returns 201 but is inert
                               # without start; fully closing it = Phase 4 ACL.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No host ports — only reachable by `anchor` on this project's private network.

volumes:
  anchor_data:
  # The nucleus project's MinIO volume, referenced (not created) so Anchor can
  # restore into it. Defaults to nucleus_minio_data; override per environment.
  minio_data:
    external: true
    name: ${ANCHOR_MINIO_VOLUME:-nucleus_minio_data}
